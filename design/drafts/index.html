<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistes de design budget</title>
<meta name="description" content="Trois directions UI/UX pour l'application de suivi de budget (React + Radix Themes).">
<style>
/* ==========================================================================
   Tokens : approximation des échelles Radix Colors (slate + accents).
   light-dark() suit prefers-color-scheme ; data-theme force un thème.
   ========================================================================== */
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --gray-1: light-dark(#fcfcfd,#111113);
  --gray-2: light-dark(#f9f9fb,#18191b);
  --gray-3: light-dark(#f0f0f3,#212225);
  --gray-4: light-dark(#e8e8ec,#272a2d);
  --gray-5: light-dark(#e0e1e6,#2e3135);
  --gray-6: light-dark(#d9d9e0,#363a3f);
  --gray-7: light-dark(#cdced6,#43484e);
  --gray-8: light-dark(#b9bbc6,#5a6169);
  --gray-9: light-dark(#8b8d98,#696e77);
  --gray-10: light-dark(#80838d,#777b84);
  --gray-11: light-dark(#60646c,#b0b4ba);
  --gray-12: light-dark(#1c2024,#edeef0);

  --panel: light-dark(#ffffff,#18191b);
  --panel-solid: light-dark(#ffffff,#212225);
  --app-bg: light-dark(#f9f9fb,#111113);
  --doc-bg: light-dark(#eceef2,#09090a);
  --overlay: light-dark(rgba(28,32,36,.30),rgba(0,0,0,.6));
  --shadow-menu: 0 12px 36px -10px light-dark(rgba(22,23,24,.28),rgba(0,0,0,.7)), 0 0 0 1px var(--gray-6);

  /* sémantiques : revenu = grass, dépassement = tomato, alerte = amber */
  --green-3: light-dark(#e9f6e9,#1b2a1e);
  --green-9: #46a758;
  --green-11: light-dark(#2a7e3b,#71d083);
  --red-3: light-dark(#feebe7,#391714);
  --red-9: #e54d2e;
  --red-11: light-dark(#d13415,#ff977d);
  --amber-3: light-dark(#fff7c2,#302008);
  --amber-9: #ffc53d;
  --amber-11: light-dark(#ab6400,#ffca16);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

/* Accents (un par direction) */
.acc-indigo{
  --accent-2: light-dark(#f7f9ff,#141726); --accent-3: light-dark(#edf2fe,#182449);
  --accent-4: light-dark(#e1e9ff,#1d2e62); --accent-5: light-dark(#d2deff,#253974);
  --accent-6: light-dark(#c1d0ff,#304384); --accent-7: light-dark(#abbdf9,#3a4f97);
  --accent-8: light-dark(#8da4ef,#435db1); --accent-9: #3e63dd;
  --accent-10: light-dark(#3358d4,#5472e4); --accent-11: light-dark(#3a5bc7,#9eb1ff);
  --accent-12: light-dark(#1f2d5c,#d6e1ff); --accent-contrast:#fff;
}
.acc-teal{
  --accent-2: light-dark(#f3fbf9,#111c1b); --accent-3: light-dark(#e0f8f3,#0d2d2a);
  --accent-4: light-dark(#ccf3ea,#023b37); --accent-5: light-dark(#b8eae0,#084843);
  --accent-6: light-dark(#a1ded2,#145750); --accent-7: light-dark(#83cdc1,#1c6961);
  --accent-8: light-dark(#53b9ab,#207e73); --accent-9: #12a594;
  --accent-10: light-dark(#0d9b8a,#0eb39e); --accent-11: light-dark(#008573,#0bd8b6);
  --accent-12: light-dark(#0d3d38,#adf0dd); --accent-contrast:#fff;
}
.acc-violet{
  --accent-2: light-dark(#faf8ff,#1b1525); --accent-3: light-dark(#f4f0fe,#291f43);
  --accent-4: light-dark(#ebe4ff,#33255b); --accent-5: light-dark(#e1d9ff,#3c2e69);
  --accent-6: light-dark(#d4cafe,#473876); --accent-7: light-dark(#c2b5f5,#56468b);
  --accent-8: light-dark(#aa99ec,#6958ad); --accent-9: #6e56cf;
  --accent-10: light-dark(#654dc4,#7d66d9); --accent-11: light-dark(#6550b9,#baa7ff);
  --accent-12: light-dark(#2f265f,#e2ddfe); --accent-contrast:#fff;
}
.acc-gray{
  --accent-2: var(--gray-2); --accent-3: var(--gray-3); --accent-4: var(--gray-4); --accent-5: var(--gray-5);
  --accent-6: var(--gray-6); --accent-7: var(--gray-7); --accent-8: var(--gray-8); --accent-9: var(--gray-12);
  --accent-10: var(--gray-11); --accent-11: var(--gray-12); --accent-12: var(--gray-12); --accent-contrast: var(--gray-1);
}

/* Couleurs de catégories (Radix : step 3 fond, 9 plein, 11 texte) */
.c-blue{--c3: light-dark(#e6f4fe,#0d2847); --c9:#0090ff; --c11: light-dark(#0d74ce,#70b8ff)}
.c-orange{--c3: light-dark(#ffefd6,#331e0b); --c9:#f76b15; --c11: light-dark(#cc4e00,#ffa057)}
.c-crimson{--c3: light-dark(#ffe9f0,#3a0f1d); --c9:#e93d82; --c11: light-dark(#cb1d63,#ff92ad)}
.c-cyan{--c3: light-dark(#def7f9,#082c36); --c9:#00a2c7; --c11: light-dark(#107d98,#4ccce6)}
.c-purple{--c3: light-dark(#f7edfe,#301c3b); --c9:#8e4ec6; --c11: light-dark(#8145b5,#d19dff)}
.c-amber{--c3: light-dark(#fff7c2,#302008); --c9:#ffc53d; --c11: light-dark(#ab6400,#ffca16)}
.c-pink{--c3: light-dark(#fee9f5,#37172f); --c9:#d6409f; --c11: light-dark(#c2298a,#ff8dcc)}
.c-plum{--c3: light-dark(#fbebfb,#351a35); --c9:#ab4aba; --c11: light-dark(#953ea3,#e796f3)}
.c-brown{--c3: light-dark(#f6eee7,#28211d); --c9:#ad7f58; --c11: light-dark(#a07856,#dbb594)}
.c-grass{--c3: var(--green-3); --c9: var(--green-9); --c11: var(--green-11)}
.c-gray{--c3: var(--gray-3); --c9: var(--gray-8); --c11: var(--gray-11)}
.c-red{--c3: var(--red-3); --c9: var(--red-9); --c11: var(--red-11)}

/* ==========================================================================
   Page de présentation
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--doc-bg);color:var(--gray-12);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent-11);text-decoration:none}
a:hover{text-decoration:underline}
.doc-head{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--gray-1) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--gray-5)}
.doc-head-in{max-width:1360px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.doc-title{font-weight:700;font-size:15px;line-height:1.2}
.doc-title small{display:block;font-weight:400;color:var(--gray-11);font-size:12px;margin-top:2px}
.dir-tabs{display:flex;gap:2px;background:var(--gray-3);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.dir-tab{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--gray-11);padding:6px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;display:flex;gap:8px;align-items:center}
.dir-tab:hover{color:var(--gray-12)}
.dir-tab .sw{width:8px;height:8px;border-radius:50%;background:var(--accent-9)}
.dir-tab[aria-selected="true"]{background:var(--panel-solid);color:var(--gray-12);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--gray-5)}
.theme-btn{margin-left:auto;border:0;font:inherit;font-size:13px;font-weight:500;background:var(--gray-3);color:var(--gray-12);height:30px;padding:0 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
main.doc{max-width:1360px;margin:0 auto;padding:28px 24px 64px}
.dir{display:none}
.dir.on{display:block}
.intro h1{font-size:30px;letter-spacing:-.025em;margin:0 0 6px;line-height:1.15}
.intro .kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-11);margin-bottom:6px}
.lede{font-size:16px;color:var(--gray-11);max-width:76ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-3);color:var(--accent-11);font-weight:500}
.chip.gray{background:var(--gray-3);color:var(--gray-11)}
.screen-nav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.screen-nav a{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--panel);box-shadow:0 0 0 1px var(--gray-5);color:var(--gray-12)}
.screen-nav a:hover{text-decoration:none;box-shadow:0 0 0 1px var(--accent-8)}
.screen{margin:44px 0 0;scroll-margin-top:90px}
.screen-head{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px}
.screen-head h2{font-size:19px;margin:0;letter-spacing:-.01em}
.screen-head .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-9);color:var(--accent-contrast);font-size:12px;font-weight:700;transform:translateY(-2px)}
.screen-head .meta{font-size:13px;color:var(--gray-11)}
.points{margin:14px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:6px 28px;font-size:13px;color:var(--gray-11)}
.points li{padding-left:16px;position:relative}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent-9)}
.points b{color:var(--gray-12);font-weight:600}
.stage{position:relative;width:100%;overflow:hidden}
.device{transform-origin:0 0;position:relative}
.device.desk{width:1280px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--gray-6),0 18px 40px -22px rgba(0,0,0,.35)}
.device.phone{width:410px;border-radius:46px;padding:10px;background:#0b0b0d;box-shadow:0 0 0 1px var(--gray-7),0 18px 40px -18px rgba(0,0,0,.45)}
.phone-screen{border-radius:36px;overflow:hidden;height:824px;display:flex;flex-direction:column;background:var(--app-bg);position:relative}
.mobile-row{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:36px;align-items:start}
.mobile-row .side-text{padding-top:4px}
.mobile-row .side-text h3{margin:0 0 6px;font-size:15px}
.mobile-row .side-text p{margin:0 0 12px;color:var(--gray-11);font-size:14px}
@media (max-width:820px){.mobile-row{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.doc-head{position:static}.doc-head-in{padding:10px 16px}main.doc{padding:20px 16px 48px}.theme-btn{margin-left:0}.notes{padding:20px}}
.crop .app{max-height:470px;overflow:hidden}
.crop .device.desk::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom,transparent,var(--app-bg));pointer-events:none}

.notes{margin:52px 0 0;border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--gray-5);padding:28px}
.notes h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.notes > p{margin:0 0 20px;color:var(--gray-11)}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px 28px}
.notes h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);margin:0 0 8px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:0 0 6px}
.notes .effort{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.meter{display:inline-flex;gap:3px}
.meter i{width:18px;height:6px;border-radius:3px;background:var(--gray-5)}
.meter i.f{background:var(--accent-9)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--gray-5)}
.cmp th,.cmp td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--gray-4)}
.cmp thead th{font-size:13px;background:var(--gray-2)}
.cmp tbody th{font-weight:600;color:var(--gray-11);font-size:13px;width:170px}
.cmp-wrap{overflow-x:auto}
.reco{margin-top:28px;border-radius:14px;padding:24px;background:var(--accent-3);color:var(--accent-12)}
.reco h2{margin:0 0 8px;font-size:20px}
.reco ol,.reco ul{margin:8px 0 0;padding-left:20px}
.reco li{margin-bottom:6px}

/* ==========================================================================
   Composants « Radix Themes » (mockups)
   ========================================================================== */
.app{position:relative;font-size:14px;line-height:1.45;color:var(--gray-12);background:var(--app-bg);text-align:left}
.app *{min-width:0}
.ic{flex:none;display:block}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.xs{font-size:12px}
.sm{font-size:13px}
.b{font-weight:600}
.muted{color:var(--gray-11)}
.faint{color:var(--gray-10)}
.r{text-align:right}
.nowrap{white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:var(--mono)}
.tnum,.amt,.app table{font-variant-numeric:tabular-nums}
.amt{white-space:nowrap}
.pos{color:var(--green-11)}
.amt.tr{color:var(--gray-10)}
.neg-red{color:var(--red-11)}
.sep-v{width:1px;align-self:stretch;background:var(--gray-5)}

.card{background:var(--panel);border-radius:10px;box-shadow:0 0 0 1px var(--gray-5);padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h3{font-size:15px;margin:0;font-weight:600}
.heading{font-size:15px;font-weight:600;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font:inherit;font-size:14px;font-weight:500;border:0;white-space:nowrap;background:transparent;color:var(--gray-12)}
.btn.solid{background:var(--accent-9);color:var(--accent-contrast)}
.btn.soft{background:var(--accent-3);color:var(--accent-11)}
.btn.surface{background:var(--panel);box-shadow:inset 0 0 0 1px var(--gray-7);color:var(--gray-12)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--accent-7);color:var(--accent-11)}
.btn.ghost{color:var(--gray-11)}
.btn.ghost.acc{color:var(--accent-11)}
.btn.gray{background:var(--gray-3);color:var(--gray-12)}
.btn.danger{color:var(--red-11)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:4px;gap:4px}
.btn.lg{height:40px;padding:0 16px;font-size:15px;border-radius:8px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:24px}
.btn[disabled]{opacity:.45}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;font-size:12px;font-weight:500;background:var(--c3,var(--gray-3));color:var(--c11,var(--gray-11));white-space:nowrap;line-height:1}
.badge.acc{background:var(--accent-3);color:var(--accent-11)}
.badge.solid{background:var(--accent-9);color:var(--accent-contrast)}
.badge.lg{height:26px;padding:0 9px;font-size:13px}
.badge.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--gray-6);color:var(--gray-11)}
.badge.none{background:transparent;color:var(--gray-11);border:1px dashed var(--gray-8)}
.badge.trig{cursor:default}
.badge.trig .ic{opacity:.7;margin-right:-2px}
.badge.focus{box-shadow:0 0 0 2px var(--accent-8)}
.badge.plain{background:transparent;padding:0;height:auto;color:var(--gray-12);font-size:13px}

.tf{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--gray-7);color:var(--gray-10);font-size:14px;white-space:nowrap}
.tf .val{color:var(--gray-12)}
.tf.focus{box-shadow:inset 0 0 0 1px var(--accent-8),0 0 0 2px var(--accent-5)}
.tf.sm{height:26px;font-size:13px;padding:0 8px}
.caret{display:inline-block;width:1px;height:16px;background:var(--accent-11);margin-left:-6px}
.sel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--gray-7);color:var(--gray-12);font-size:14px;white-space:nowrap}
.sel .ic:last-child{color:var(--gray-10)}
.sel.sm{height:26px;font-size:13px;padding:0 8px}
.sel.open{box-shadow:inset 0 0 0 1px var(--accent-8),0 0 0 2px var(--accent-5)}
.sel.soft{background:var(--accent-3);color:var(--accent-11);box-shadow:none}
.sel.ghost{background:transparent;box-shadow:none}

.seg{display:inline-flex;background:var(--gray-3);border-radius:7px;padding:2px;gap:0}
.seg span{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:5px;font-size:13px;color:var(--gray-11);font-weight:500;white-space:nowrap}
.seg span.on{background:var(--panel-solid);color:var(--gray-12);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--gray-5)}
.seg .n{font-size:11px;color:var(--gray-10);font-weight:500}
.seg .on .n{color:var(--accent-11)}

.tabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--gray-5)}
.tab{height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--gray-11);font-weight:500;font-size:14px;white-space:nowrap}
.tab.on{color:var(--gray-12);box-shadow:inset 0 -2px 0 var(--accent-9)}
.tab .n{font-size:11px;height:18px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--gray-4);color:var(--gray-11);display:inline-grid;place-items:center}
.tab.on .n{background:var(--accent-9);color:var(--accent-contrast)}

.progress{position:relative;height:6px;border-radius:999px;background:var(--gray-4);overflow:hidden}
.progress > i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--accent-9)}
.progress.warn > i{background:var(--amber-9)}
.progress.over > i{background:var(--red-9)}
.progress.cat > i{background:var(--c9)}
.progress.neutral > i{background:var(--gray-9)}
.pbar{position:relative}
.pace{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--gray-12);opacity:.45}

.callout{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--accent-3);color:var(--accent-11);font-size:14px}
.callout b{color:var(--accent-12)}
.callout.amber{background:var(--amber-3);color:var(--amber-11)}
.callout.amber b{color:var(--gray-12)}
.callout.gray{background:var(--gray-3);color:var(--gray-11)}
.callout.gray b{color:var(--gray-12)}

.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;font:500 11px/1 var(--font);color:var(--gray-11);background:var(--gray-1);box-shadow:inset 0 -1px 0 var(--gray-7),inset 0 0 0 1px var(--gray-6);white-space:nowrap}
.btn.solid .kbd{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}

.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-3);color:var(--accent-11);font-weight:600;font-size:12px;display:inline-grid;place-items:center;flex:none}
.avatar.sm{width:22px;height:22px;font-size:10px}
.avatar.amber{background:var(--amber-3);color:var(--amber-11)}
.avatar.cat{background:var(--c3);color:var(--c11)}
.avatar.gray{background:var(--gray-4);color:var(--gray-11)}
.emo{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;font-size:16px;background:var(--c3,var(--gray-3));flex:none}
.emo.sm{width:24px;height:24px;font-size:13px;border-radius:6px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c9,var(--gray-8));flex:none}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.cb{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--gray-7);background:var(--panel);display:inline-grid;place-items:center;flex:none;color:#fff}
.cb.on{background:var(--accent-9);box-shadow:none}
.cb.mixed{background:var(--accent-9);box-shadow:none}

function donut(segs, size = 180, th = 22) {
  const r = (size - th) / 2, c = size / 2;
  const tot = segs.reduce((a, s) => a + s.v, 0);
  let off = 0;
  const arcs = segs.map(s => {
    const p = (s.v / tot) * 100;
    const len = Math.max(p - 0.7, 0.2);
    const el = `<circle class="c-${s.c}" cx="${c}" cy="${c}" r="${r}" pathLength="100" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-off}" style="stroke:var(--c9)"/>`;
    off += p;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${c} ${c})" fill="none" stroke-width="${th}"><circle cx="${c}" cy="${c}" r="${r}" style="stroke:var(--gray-3)"/>${arcs}</g></svg>`;
}
const EXP_SEGS = Object.entries(SPENT).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ k, v, c: CAT[k].c }));

/* Barres revenus / dépenses + courbe du taux d'épargne */
function barsChart(W, H, o = {}) {
  const pl = 46, pr = o.rate ? 36 : 8, pt = 10, pb = 24;
  const iw = W - pl - pr, ih = H - pt - pb, max = 7000;
  const gw = iw / MONTHS.length, bw = Math.min(14, gw * 0.3);
  const y = v => pt + ih - (v / max) * ih;
  const yr = v => pt + ih - (v / 0.6) * ih;
  let s = '';
  for (const g of [0, 2000, 4000, 6000]) {
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--gray-4)" ${g ? 'stroke-dasharray="3 3"' : ''}/>`;
    s += `<text class="svgtxt" x="${pl - 8}" y="${y(g) + 4}" text-anchor="end">${NUM0.format(g)}</text>`;
  }
  if (o.rate) for (const g of [0, 0.2, 0.4, 0.6]) s += `<text class="svgtxt" x="${W - pr + 6}" y="${yr(g) + 4}">${pct0(g)}</text>`;
  const pts = [];
  MONTHS.forEach((m, i) => {
    const cx = pl + gw * i + gw / 2;
    const cur = i === MONTHS.length - 1;
    const op = cur ? 'opacity:.5' : '';
    s += `<rect x="${cx - bw - 1}" y="${y(m.inc)}" width="${bw}" height="${ih + pt - y(m.inc)}" rx="2.5" style="fill:var(--green-9);${op}"/>`;
    s += `<rect x="${cx + 1}" y="${y(m.exp)}" width="${bw}" height="${ih + pt - y(m.exp)}" rx="2.5" style="fill:var(--gray-8);${op}"/>`;
    s += `<text class="svgtxt" x="${cx}" y="${H - 6}" text-anchor="middle" ${cur ? 'style="font-weight:600;fill:var(--gray-12)"' : ''}>${fMon(m.m)}</text>`;
    pts.push([cx, yr(m.rate)]);
  });
  if (o.rate) {
    s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" style="stroke:var(--accent-9)" stroke-width="2" stroke-linejoin="round"/>`;
    s += pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4 : 2.5}" style="fill:var(--panel);stroke:var(--accent-9)" stroke-width="2"/>`).join('');
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`;
}

/* Aire du taux d'épargne sur 12 mois */
function rateArea(W, H, o = {}) {
  const pl = o.axis ? 34 : 4, pr = 6, pt = 10, pb = o.axis ? 22 : 6;
  const iw = W - pl - pr, ih = H - pt - pb;
  const x = i => pl + (iw / (MONTHS.length - 1)) * i;
  const y = v => pt + ih - (v / 0.6) * ih;
  const pts = MONTHS.map((m, i) => [x(i), y(m.rate)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent-9);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent-9);stop-opacity:0"/></linearGradient></defs>`;
  if (o.axis) {
    for (const g of [0, 0.2, 0.4]) {
      s += `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--gray-4)" stroke-dasharray="3 3"/><text class="svgtxt" x="${pl - 6}" y="${y(g) + 4}" text-anchor="end">${pct0(g)}</text>`;
    }
    MONTHS.forEach((m, i) => { if (i % 2 === 1 || i === MONTHS.length - 1) s += `<text class="svgtxt" x="${x(i)}" y="${H - 5}" text-anchor="middle">${fMon(m.m)}</text>`; });
  }
  s += `<polygon points="${pl},${pt + ih} ${line} ${x(MONTHS.length - 1)},${pt + ih}" fill="url(#${id})"/>`;
  s += `<polyline points="${line}" fill="none" style="stroke:var(--accent-9)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length - 1];
  s += `<circle cx="${last[0]}" cy="${last[1]}" r="4" style="fill:var(--panel);stroke:var(--accent-9)" stroke-width="2"/>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`;
}

/* Mini barres : 3 mois précédents + mois en cours */
function miniBars(b, W = 64, H = 22) {
  const vals = [...b.h, b.spent];
  const max = Math.max(b.lim, ...vals) * 1.05;
  const bw = 10, gap = (W - bw * 4) / 3;
  let s = `<line x1="0" x2="${W}" y1="${H - (b.lim / max) * H}" y2="${H - (b.lim / max) * H}" style="stroke:var(--gray-8)" stroke-dasharray="2 2"/>`;
  vals.forEach((v, i) => {
    const h = Math.max(2, (v / max) * H);
    const over = v > b.lim;
    const fill = i === 3 ? (over ? 'var(--red-9)' : 'var(--accent-9)') : (over ? 'var(--red-9)' : 'var(--gray-7)');
    s += `<rect x="${i * (bw + gap)}" y="${H - h}" width="${bw}" height="${h}" rx="2" style="fill:${fill};${i < 3 && over ? 'opacity:.45' : ''}"/>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`;
}

/* Sparkline simple */
function spark(vals, W = 120, H = 28, color = 'var(--accent-9)') {
  const min = Math.min(...vals), max = Math.max(...vals);
  const pts = vals.map((v, i) => `${(W / (vals.length - 1)) * i},${H - 3 - ((v - min) / (max - min || 1)) * (H - 6)}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

const FREQ = { m: { l: 'Mensuel', d: 1, u: '/mois' }, q: { l: 'Trimestriel', d: 3, u: '/trim.' }, y: { l: 'Annuel', d: 12, u: '/an' } };
const PERSONS = [{ n: 'Mike', share: 0.6, a: 'MI', av: '' }, { n: 'Julie', share: 0.4, a: 'JU', av: 'cat c-pink' }];
const SPLIT_LINES = [
  { t: 'charge', n: 'Prêt immobilier', e: '🏦', f: 'm', v: 1150 },
  { t: 'charge', n: 'Assurance habitation', e: '🛡️', f: 'y', v: 420 },

  { t: 'charge', n: 'Électricité', e: '⚡', f: 'm', v: 95, prev: 88 },
  { t: 'charge', n: 'Internet', e: '🌐', f: 'm', v: 35 },
  { t: 'charge', n: 'Eau', e: '💧', f: 'q', v: 90 },
  { t: 'save', n: 'Épargne commune', e: '🐷', f: 'm', v: 400 },
  { t: 'save', n: 'Livret A vacances', e: '🏖️', f: 'm', v: 100 },
];
const NUM2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num2 = v => NUM2.format(v);
const perMonth = l => round2(l.v / FREQ[l.f].d);
/* Calcul : à garder = charges lissées + épargne commune ; contribution = à garder x part ; à renvoyer = revenus - contribution */
function splitCalc(elec, inc) {
  const lines = SPLIT_LINES.map(l => ({ ...l, v: l.n === 'Électricité' && elec != null ? elec : l.v }));
  const charges = round2(lines.filter(l => l.t === 'charge').reduce((a, l) => a + perMonth(l), 0));
  const saves = round2(lines.filter(l => l.t === 'save').reduce((a, l) => a + perMonth(l), 0));
  const keep = round2(charges + saves);
  const per = PERSONS.map((p, i) => { const contrib = round2(keep * p.share); return { ...p, income: inc[i], contrib, back: round2(inc[i] - contrib) }; });
  return { lines, charges, saves, keep, per };
}
const SPLIT = splitCalc(null, [3200, 2400]);
const SPLIT_PREV = splitCalc(88, [3200, 2400]);

  ['2026-05', 91, [3200, 2400], ''],
].map(([m, e, inc, note]) => ({ m, note, ...splitCalc(e, inc) }));

const PRORATA = 3200 / 5600;

const provision = l => l.f === 'm' ? '' : ` <span class="badge acc" title="${eur(l.v)} ${FREQ[l.f].u}">provision</span>`;
const backAmt = (v, big) => v < 0
  ? `<span class="amt neg-red b">${MINUS}${eur(-v)}</span>`
  : `<span class="amt ${big ? '' : ''}">${eur(v)}</span>`;
const deltaTxt = (v, prev) => { const d = round2(v - prev); return d === 0 ? 'identique à septembre' : `${d > 0 ? '+' : MINUS}${eur(Math.abs(d))} vs septembre`; };
function stackBar(parts, h = 10) {
  const tot = parts.reduce((a, p) => a + p.v, 0);
  return `<div style="display:flex;gap:2px;height:${h}px;border-radius:999px;overflow:hidden">${parts.map(p => `<span style="flex:${p.v / tot};background:${p.c}"></span>`).join('')}</div>`;
}

    <div><div class="xs muted">À renvoyer sur son compte perso</div><div class="amt" style="font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2">${backAmt(p.back)}</div></div>
    <div class="xs faint">Contribution : ${pct0(p.contrib / p.income)} de ses revenus · ${deltaTxt(p.contrib, SPLIT_PREV.per[i].contrib)}</div>
  </div>`;
  const lineRow = l => {
    const editing = l.prev != null;
    return `<tr>
      <td><span class="row"><span>${l.e}</span><span class="b">${l.n}</span></span></td>
      <td>${freqSel(l.f)}</td>
      <td class="r"><span class="limit ${editing ? 'editing' : ''}">${editing ? `<span class="amt">95,00</span><span class="caret" style="margin:0 0 0 1px"></span>&nbsp;€` : `<span class="amt">${eur(l.v)}</span>`}</span>${editing ? `<div class="xs" style="color:var(--amber-11);margin-top:2px">avant : ${eur(l.prev)}</div>` : ''}</td>
      <td class="r"><span class="amt">${eur(perMonth(l))}</span>${provision(l)}</td>
    </tr>`;
  };
  const grp = (label, t, total) => `<tr class="grp"><td colspan="3">${label}</td><td class="r amt">${eur(total)} / mois</td></tr>${S.lines.filter(l => l.t === t).map(lineRow).join('')}`;
  const body = `
    <div class="callout">${ic('copy', 18)}<span>Octobre est <b>pré-rempli depuis septembre</b>. 1 ligne modifiée (Électricité), le résultat se recalcule à chaque saisie.</span><span class="grow"></span><span class="btn ghost acc sm">Historique</span><span class="btn solid sm">${ic('check', 13)} Valider octobre</span></div>
    <div class="grid" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)">
      <div class="card col" style="gap:12px;background:var(--accent-3);box-shadow:0 0 0 1px var(--accent-6)">
        <div class="row"><span class="emo sm" style="background:var(--panel)">🏡</span><span class="b" style="color:var(--accent-12)">À garder sur le compte commun</span></div>
        <div class="amt" style="font-size:38px;font-weight:750;letter-spacing:-.03em;line-height:1.1;color:var(--accent-12)">${eur(S.keep)}</div>
        ${stackBar([{ v: S.charges, c: 'var(--accent-9)' }, { v: S.saves, c: 'var(--green-9)' }])}
        <div class="col sm" style="gap:4px;color:var(--accent-12)">
          <div class="between"><span class="row" style="gap:6px"><span class="sdot" style="background:var(--accent-9)"></span>Charges lissées</span><span class="amt">${eur(S.charges)}</span></div>
          <div class="between"><span class="row" style="gap:6px"><span class="sdot" style="background:var(--green-9)"></span>Épargne commune</span><span class="amt">${eur(S.saves)}</span></div>
        </div>
        <span class="badge" style="align-self:flex-start;background:var(--panel)">+${eur(S.keep - SPLIT_PREV.keep)} vs septembre</span>
      </div>
      ${S.per.map(person).join('')}
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start">
      <div class="card" style="padding:0;overflow:hidden">
        <div class="card-h" style="padding:14px 16px 0"><h3>Lignes communes</h3><span class="xs muted">Lissage : 1 300 €/an = 108,33 €/mois</span></div>
        <table class="table btable">
          <thead><tr><th>Ligne</th><th style="width:132px">Fréquence</th><th class="r" style="width:122px">Montant</th><th class="r" style="width:168px">Par mois</th></tr></thead>
          <tbody>
            ${grp('Charges', 'charge', S.charges)}
            ${grp('Épargne commune', 'save', S.saves)}
            <tr><td colspan="2"><span class="btn ghost acc sm">${ic('plus', 12)} Ajouter une ligne</span></td><td class="r b">Total</td><td class="r b amt">${eur(S.keep)} / mois</td></tr>
          </tbody>
        </table>
      </div>
      <div class="col" style="gap:16px">
        <div class="card">
          <div class="card-h"><h3>Parts du foyer</h3><span class="badge c-grass">${ic('check', 12)} total 100 %</span></div>
          ${stackBar([{ v: 60, c: 'var(--accent-9)' }, { v: 40, c: 'var(--c9)' }], 12).replace('<div style', '<div class="c-pink" style')}
          ${PERSONS.map(p => `<div class="between" style="padding:10px 0 0">${`<span class="row">${avatar(p.a, p.av + ' sm')}<span class="b sm">${p.n}</span></span>`}<span class="limit" style="min-width:76px">${pct0(p.share)}</span></div>`).join('')}
          <div class="xs muted" style="margin-top:10px">Parts libres. <a>Proposer au prorata des revenus (${pct0(PRORATA)} / ${pct0(1 - PRORATA)})</a></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Revenus d’octobre</h3><span class="amt pos b sm">+${eur(5600)}</span></div>
          ${INCOME_LINES.map(l => `<div class="between" style="padding:6px 0"><span class="row sm">${avatar(PERSONS[l.p].a, PERSONS[l.p].av + ' sm')}${l.n} ${PERSONS[l.p].n}</span><span class="limit"><span class="amt">${eur(l.v)}</span></span></div>`).join('')}
          <span class="btn ghost acc sm" style="margin-top:6px">${ic('plus', 12)} Ajouter un revenu (prime, remboursement…)</span>
        </div>
        <div class="card">
          <div class="card-h"><h3>Mois précédents</h3><a class="sm">Tout voir</a></div>
          ${SPLIT_HIST.slice(0, 4).map(h => `<div class="col" style="gap:3px;padding:8px 0;box-shadow:0 1px 0 var(--gray-4)">
            <div class="between sm"><span class="b">${fMonLong(h.m)}</span><span class="amt">${eur(h.keep)}</span></div>
            <div class="between xs muted"><span>Mike ${backAmt(h.per[0].back)} · Julie ${backAmt(h.per[1].back)}</span>${h.per.some(p => p.back < 0) ? `<span class="badge c-red">Julie complète</span>` : h.note ? `<span class="faint">${h.note}</span>` : ''}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  return d1Shell({ page: 'split', title: 'Répartition du foyer', body, minH: 1060 });
}

/* ---------- Direction 2 : le tableur, colonne par personne ---------- */
function d2Split() {
  const S = SPLIT;
  const pc = (v, cls = '') => `<td class="r amt ${cls}">${v == null ? '<span class="faint">·</span>' : eur(v)}</td>`;
  const line = l => {
    const editing = l.prev != null;
    const pm = perMonth(l);
    return `<tr>
      <td><span class="row"><span>${l.e}</span><span>${l.n}</span></span></td>
      <td>${freqSel(l.f)}</td>
      <td class="r"><span class="limit ${editing ? 'editing' : ''}" style="min-width:96px">${editing ? `<span class="amt">95,00</span><span class="caret" style="margin:0 0 0 1px"></span>` : `<span class="amt">${eur(l.v)}</span>`}</span></td>
      <td class="r"><span class="amt">${eur(pm)}</span>${l.f === 'm' ? '' : `<div class="xs faint">provision</div>`}</td>
      ${pc(round2(pm * 0.6), 'muted')}${pc(round2(pm * 0.4), 'muted')}
    </tr>`;
  };
  const grp = (l, n) => `<tr class="grp"><td colspan="6"><span class="row" style="gap:8px">${l}${n ? ` · ${n}` : ''}</span></td></tr>`;
  const sub = (l, v) => `<tr><td colspan="3" class="b sm">${l}</td><td class="r b amt">${eur(v)}</td>${pc(round2(v * 0.6), 'b')}${pc(round2(v * 0.4), 'b')}</tr>`;
  const body = `<div class="d2-body">
    <div class="col" style="gap:16px">
      <div class="card hero" style="grid-template-columns:1.3fr 1fr 1fr">
        <div><div class="lbl">À garder sur le compte commun</div><div class="big amt">${eur(S.keep)}</div><div class="xs muted" style="margin-top:4px">${eur(S.charges)} de charges lissées + ${eur(S.saves)} d’épargne</div></div>
        ${S.per.map((p, i) => `<div><div class="lbl row" style="gap:6px">${avatar(p.a, p.av + ' sm')} Vers le compte de ${p.n}</div><div class="mid amt" style="font-size:24px">${backAmt(p.back)}</div><div class="xs muted">contribue ${eur(p.contrib)} (${pct0(p.share)}) · ${deltaTxt(p.contrib, SPLIT_PREV.per[i].contrib)}</div></div>`).join('')}
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <table class="table btable">
          <thead><tr><th>Ligne</th><th style="width:130px">Fréquence</th><th class="r" style="width:120px">Montant</th><th class="r" style="width:110px">Par mois</th>
            <th class="r" style="width:118px"><span class="row" style="justify-content:flex-end;gap:6px">${avatar('MI', 'sm')}Mike <span class="badge acc">60 %</span></span></th>
            <th class="r" style="width:118px"><span class="row" style="justify-content:flex-end;gap:6px">${avatar('JU', 'cat c-pink sm')}Julie <span class="badge acc">40 %</span></span></th></tr></thead>
          <tbody>
            ${grp('Revenus', '')}
            ${INCOME_LINES.map(l => `<tr><td><span class="row">💼 ${l.n} ${PERSONS[l.p].n}</span></td><td>${freqSel('m')}</td><td class="r"><span class="limit" style="min-width:96px"><span class="amt">${eur(l.v)}</span></span></td><td class="r amt pos">+${eur(l.v)}</td>${l.p === 0 ? `<td class="r amt pos">+${eur(l.v)}</td>${pc(null)}` : `${pc(null)}<td class="r amt pos">+${eur(l.v)}</td>`}</tr>`).join('')}
            ${grp('Charges communes', S.lines.filter(l => l.t === 'charge').length)}
            ${S.lines.filter(l => l.t === 'charge').map(line).join('')}
            ${sub('Charges lissées', S.charges)}
            ${grp('Épargne commune', 2)}
            ${S.lines.filter(l => l.t === 'save').map(line).join('')}
            <tr style="background:var(--accent-3)"><td colspan="3" class="b" style="color:var(--accent-12)">À garder sur le compte commun</td><td class="r b amt" style="color:var(--accent-12)">${eur(S.keep)}</td>${S.per.map(p => `<td class="r b amt" style="color:var(--accent-12)">${eur(p.contrib)}</td>`).join('')}</tr>
            <tr><td colspan="4" class="b">À renvoyer sur le compte perso</td>${S.per.map(p => `<td class="r"><span class="pill ok">${eur(p.back)}</span></td>`).join('')}</tr>
          </tbody>
        </table>
      </div>
      <span class="btn ghost acc" style="align-self:flex-start">${ic('plus')} Ajouter une ligne commune</span>
    </div>
    <div class="col" style="gap:16px">
      <div class="card">
        <div class="card-h"><h3>Parts</h3><span class="badge c-grass">${ic('check', 12)} 100 %</span></div>
        <div class="c-pink">${stackBar([{ v: 60, c: 'var(--accent-9)' }, { v: 40, c: 'var(--c9)' }], 12)}</div>
        <div class="between sm" style="margin-top:10px"><span class="row">${avatar('MI', 'sm')} Mike <span class="limit" style="min-width:64px">60 %</span></span><span class="row"><span class="limit" style="min-width:64px">40 %</span> Julie ${avatar('JU', 'cat c-pink sm')}</span></div>
        <div class="xs muted" style="margin-top:10px">Au prorata des revenus, ce serait ${pct0(PRORATA)} / ${pct0(1 - PRORATA)}. <a>Appliquer</a></div>
      </div>
      <div class="card" style="padding:8px 8px 4px">
        <div class="card-h" style="padding:6px 8px 0;margin-bottom:6px"><h3>Historique</h3><span class="xs muted">commun · Mike · Julie</span></div>
        ${SPLIT_HIST.map(h => {
          const neg = h.per.find(p => p.back < 0);
          return `<div class="env" style="grid-template-columns:minmax(0,1fr) auto;${neg ? 'background:var(--red-3)' : ''}">
            <span class="b sm">${fMonLong(h.m)}</span><span class="amt sm">${eur(h.keep)}</span>
            <span class="xs muted" style="grid-column:1/-1">Mike ${backAmt(h.per[0].back)} · Julie ${backAmt(h.per[1].back)}${h.note ? `<br><span class="faint">${h.note}</span>` : ''}</span>
            ${neg ? `<span class="xs neg-red b" style="grid-column:1/-1">${neg.n} a dû compléter ${eur(-neg.back)} sur le commun</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  return d2Shell({ page: 'split', body, minH: 1080, monthActions: `<span class="badge lg">${ic('copy', 13)} Pré-rempli depuis septembre</span><span class="btn solid">${ic('check')} Valider le mois</span>` });
}

/* ---------- Direction 3 : grille éditable + calcul transparent ---------- */
function d3Split() {
  const S = SPLIT;
  const rows = [
    ...INCOME_LINES.map(l => ({ type: 'Revenu', who: PERSONS[l.p].n, n: `${l.n} ${PERSONS[l.p].n}`, e: '💼', f: 'm', v: l.v, inc: true })),
    ...S.lines.map(l => ({ type: l.t === 'charge' ? 'Charge' : 'Épargne', who: 'Commun', ...l })),
  ];
  const tr = (r, i) => {
    const pm = r.inc ? r.v : perMonth(r);
    const d = r.prev != null ? r.v - r.prev : 0;
    const focus = r.prev != null;
    return `<tr class="${focus ? 'cur' : ''}">
      <td class="xs faint">${i + 1}</td>
      <td><span class="badge ${r.type === 'Revenu' ? 'c-grass' : r.type === 'Épargne' ? 'acc' : ''}">${r.type}</span></td>
      <td>${r.e} ${r.n}</td>
      <td class="muted">${r.who}</td>
      <td class="muted">${FREQ[r.f].l}</td>
      <td class="r amt" style="${focus ? 'box-shadow:inset 0 0 0 2px var(--accent-9);background:var(--panel)' : ''}">${focus ? `95,00<span class="caret" style="margin:0 0 0 1px;height:14px;vertical-align:-2px"></span>` : eur(r.v)}</td>
      <td class="r amt ${r.inc ? 'pos' : ''}">${r.inc ? '+' : ''}${eur(pm)}${r.f !== 'm' ? ' <span class="xs faint">prov.</span>' : ''}</td>
      <td class="r xs ${d ? '' : 'faint'}" style="${d ? 'color:var(--amber-11);font-weight:600' : ''}">${d ? '+' + eur(d) : '='}</td>
    </tr>`;
  };
  const person = (p, i) => `<div class="col" style="gap:6px;padding:12px 0;box-shadow:0 1px 0 var(--gray-4)">
    <div class="between"><span class="row">${avatar(p.a, p.av + ' sm')}<b>${p.n}</b><span class="limit" style="min-width:56px;height:24px;font-size:12px">${pct0(p.share)}</span></span><span class="xs muted">${deltaTxt(p.contrib, SPLIT_PREV.per[i].contrib)}</span></div>
    <div class="mono xs muted">${num2(p.income)} ${MINUS} (${num2(S.keep)} × ${pct0(p.share)}) =</div>
    <div class="between"><span class="amt" style="font-size:22px;font-weight:700;letter-spacing:-.02em">${backAmt(p.back)}</span><span class="btn gray sm">${ic('copy', 12)} Copier ${kbd(String(i + 1))}</span></div>
    <div class="xs faint">à virer vers le compte perso de ${p.n}</div>
  </div>`;
  const body = `
    <div class="row" style="padding:10px 16px;gap:10px;box-shadow:0 1px 0 var(--gray-4);background:var(--panel)">
      <span class="b" style="font-size:14px">Octobre 2026</span><span class="badge c-amber">Brouillon</span>
      <span class="xs muted">pré-rempli depuis septembre · 1 modification · recalcul à chaque frappe</span>
      <span class="grow"></span>
      <span class="btn ghost sm">${ic('swap', 12)} Comparer avec septembre</span>
      <span class="btn solid sm">${ic('check', 12)} Valider le mois ${kbd('⌘')}${kbd('↵')}</span>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1;min-height:0">
      <div class="col" style="gap:14px;padding:14px 16px">
        <div class="card" style="padding:0;overflow:hidden">
          <table class="table dense">
            <thead><tr><th style="width:30px">#</th><th style="width:84px">Type</th><th>Ligne</th><th style="width:90px">Qui</th><th style="width:100px">Fréquence</th><th class="r" style="width:110px">Montant</th><th class="r" style="width:130px">Par mois</th><th class="r" style="width:80px">Δ sept.</th></tr></thead>
            <tbody>${rows.map(tr).join('')}
              <tr><td class="xs faint">${rows.length + 1}</td><td colspan="7" class="faint">${ic('plus', 12, 'style="display:inline;vertical-align:-2px"')} Nouvelle ligne ${kbd('N')}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="between" style="padding:10px 12px"><span class="b">Historique</span><span class="xs muted">${kbd('[')}${kbd(']')} changer de mois</span></div>
          <table class="table dense"><thead><tr><th>Mois</th><th class="r">À garder</th><th class="r">Mike reçoit</th><th class="r">Julie reçoit</th><th>Note</th></tr></thead>
          <tbody>${SPLIT_HIST.map(h => `<tr><td>${fMonLong(h.m)}</td><td class="r amt">${eur(h.keep)}</td><td class="r">${backAmt(h.per[0].back)}</td><td class="r">${backAmt(h.per[1].back)}${h.per[1].back < 0 ? ' <span class="badge c-red">à compléter</span>' : ''}</td><td class="xs muted">${h.note}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
      <aside style="background:var(--panel);box-shadow:-1px 0 0 var(--gray-5);padding:16px 18px;display:flex;flex-direction:column;gap:4px">
        <div class="xs b muted" style="text-transform:uppercase;letter-spacing:.05em">Résultat d’octobre</div>
        <div class="sm muted" style="margin-top:8px">À garder sur le compte commun</div>
        <div class="between"><span class="amt" style="font-size:30px;font-weight:750;letter-spacing:-.03em;color:var(--accent-11)">${eur(S.keep)}</span><span class="btn gray sm">${ic('copy', 12)} Copier ${kbd('0')}</span></div>
        <div class="mono xs muted">${num2(S.charges)} charges lissées + ${num2(S.saves)} épargne</div>
        <div style="margin-top:10px">${stackBar([{ v: S.charges, c: 'var(--accent-9)' }, { v: S.saves, c: 'var(--green-9)' }], 6)}</div>
        ${S.per.map(person).join('')}
        <div class="callout gray" style="margin-top:12px;padding:10px 12px">${ic('info', 15)}<span class="xs">Si les revenus d’une personne ne couvrent pas sa contribution, le montant passe en rouge : elle doit compléter le commun.</span></div>
        <div class="xs muted" style="margin-top:8px">Total des parts : <b style="color:var(--green-11)">100 %</b> · prorata revenus : ${pct0(PRORATA)} / ${pct0(1 - PRORATA)}</div>
      </aside>
    </div>`;
  const keys = `<span>${kbd('⇥')} cellule suivante</span><span>${kbd('↵')} éditer</span><span>${kbd('F')} fréquence</span><span>${kbd('N')} nouvelle ligne</span><span>${kbd('1')}${kbd('2')} copier un virement</span><span>${kbd('⌘')}${kbd('↵')} valider le mois</span><span class="grow"></span><span>${kbd('[')}${kbd(']')} mois</span>`;
  return d3Shell({ page: 'split', title: 'Répartition', body, keys, minH: 900 });
}

    <p style="margin:0">Les imports CSV arrivent une ou deux fois par mois : la revue est un moment, pas un écran d’accueil. En revanche, les membres du foyer (dont les lecteurs) ouvrent l’app pour <i>voir</i>, et les budgets doivent rester actionnables.</p>
    <ol>
      <li><b>Coque et accueil de la direction 1</b> : sidebar, sélecteur d’espace en haut, KPI, donut, tendance 12 mois. Le callout « X à catégoriser » mène à la file.</li>
      <li><b>Page Budgets de la direction 2</b> : « Reste à dépenser », groupes par état, repère du jour, plafond éditable en ligne, copie du mois précédent.</li>
      <li><b>File « À revoir » de la direction 3</b>, ouverte automatiquement à la fin de l’assistant d’import, avec création de règle pré-remplie et annulation de l’import.</li>
      <li><b>Répartition du foyer façon direction 2</b> (le tableur, une colonne par personne, proche de l’Excel actuel) avec les cartes résultat de la direction 1 en tête et les boutons « copier le montant » de la direction 3.</li>
      <li><b>Plus tard</b> : raccourcis J/K, 1 à 9 et palette ⌘K de la direction 3, ajoutés sans changer la mise en page.</li>
    </ol>
    <p style="margin:12px 0 0">Effort du mélange : <b>moyen</b>. V1 sans raccourcis clavier ; V2 avec raccourcis et ⌘K.</p>
  </div>`;
}

/* ==========================================================================
   Démarrage : rendu, onglets, thème, mise à l'échelle des maquettes
   ========================================================================== */
document.getElementById('d1').innerHTML = renderD1();
document.getElementById('d2').innerHTML = renderD2();
document.getElementById('d3').innerHTML = renderD3();
document.getElementById('cmp').innerHTML = renderCmp();

function fit() {
  document.querySelectorAll('.dir.on .stage').forEach(st => {
    const dv = st.firstElementChild;
    const w = +dv.dataset.w;
    const avail = st.clientWidth - 2;
    const s = Math.min(1, avail / w);
    dv.style.transform = s < 1 ? `scale(${s})` : '';
    dv.style.marginLeft = Math.max(1, (avail - w * s) / 2) + 'px';
    st.style.height = Math.ceil(dv.offsetHeight * s + 24) + 'px';
  });
}
function selectDir(id) {
  document.querySelectorAll('.dir-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.dir === id)));
  document.querySelectorAll('.dir').forEach(s => s.classList.toggle('on', s.id === id));
  fit();
}
document.querySelectorAll('.dir-tab').forEach(b => b.addEventListener('click', () => {
  selectDir(b.dataset.dir);
  try { history.replaceState(null, '', '#' + b.dataset.dir); } catch (e) { /* aperçu sans historique */ }
  window.scrollTo({ top: 0 });
}));
document.querySelectorAll('.screen-nav a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  const el = document.querySelector(a.getAttribute('href'));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}));
const initial = (location.hash || '').replace('#', '').split('-')[0];
if (['d1', 'd2', 'd3', 'cmp'].includes(initial)) selectDir(initial);

const THEMES = ['auto', 'light', 'dark'];
const THEME_LBL = { auto: 'Thème : auto', light: 'Thème : clair', dark: 'Thème : sombre' };
let theme = 'auto';
try { theme = localStorage.getItem('drafts-theme') || 'auto'; } catch (e) { theme = 'auto'; }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = THEME_LBL[theme];
}
document.getElementById('themeBtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem('drafts-theme', theme); } catch (e) { /* stockage indisponible */ }
  applyTheme();
});
applyTheme();
fit();
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
