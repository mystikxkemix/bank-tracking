# Production: one container serving API + web, connecting to the MongoDB container already running on the same machine.
services:
  bank-tracking:
    build: .
    image: bank-tracking:${APP_VERSION:-latest}
    container_name: bank-tracking
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    # Lets the container reach the host's published Mongo port as host.docker.internal (needed on Linux, harmless on macOS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
