name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in sync with the Dockerfile (node:22-alpine).
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --no-fund --no-audit
      - run: npm run check

  # Publishes ghcr.io/<owner>/bank-tracking after the checks pass on main.
  # The package must be public so ZimaOS (and the app store workflow) pull it without a login.
  image:
    name: Publish image
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the version counts main commits
      # Version 1.<number of commits on main>: grows by one per push, and a re-run
      # of the same commit gets the same version. The app store picks up new 1.N tags.
      - id: version
        run: echo "version=1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bank-tracking
          # The version tag has the highest priority, so it is also the image's
          # org.opencontainers.image.version label.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build provenance: it embeds the GitHub push event (commit emails and
          # messages), which anyone could read if the package is public.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
